        /* SEGURO ANTI-COLAPSO DE ÍCONOS */
        svg { max-width: 100%; max-height: 100%; flex-shrink: 0; display: inline-block; }
        
        .hide-scroll::-webkit-scrollbar { display: none; }
        
        /* TARJETAS OPTIMIZADAS (Sin blur ni backdrop-filter) */
        .glass-card { 
            background: rgba(255, 255, 255, 0.95); 
            border: 1px solid rgba(255, 255, 255, 0.8);

            border-radius: 1.5rem;

        .modal-overlay { 
            background: rgba(10, 8, 7, 0.98); 
        }

        /* ANIMACIONES LIGERAS */
        @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } } 
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        
        @keyframes slideUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }

        @keyframes zoomIn { 0% { opacity: 0; transform: scale(0.95); } 100% { opacity: 1; transform: scale(1); } }

            for (let i = 0; i <= retries; i++) {
                try {
                    const response = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action, payload }),
                        redirect: 'follow'
                    });
                    return await response.json();
                } catch (error) {
                    if (i === retries) {
                        return { status: 'error', message: 'Interferencia en la red detectada. Asegúrate de tener buena conexión e intenta de nuevo.' };
                    }
                    await new Promise(resolve => setTimeout(resolve, 1500));
                }
            }

        const getVideoData = (url) => {
            if (!url) return { type: null, id: null };
            const safeUrl = String(url);
            const ytRegex = new RegExp("^.*(youtu\\.be\\/|v\\/|u\\/\\w\\/|embed\\/|watch\\?v=|\\&v=)([^#\\&\\?]*).*");
            const ytMatch = safeUrl.match(ytRegex);
            if (ytMatch && ytMatch[2].length === 11) return { type: 'youtube', id: ytMatch[2] };
            const driveRegex = new RegExp("(?:\\/d\\/|id=)([a-zA-Z0-9_-]+)");
            const driveMatch = safeUrl.match(driveRegex);
            if (driveMatch) return { type: 'drive', id: driveMatch[1] };
            return { type: null, id: null };
        };

            if (!fechaString) return 'N/A';
            const date = new Date(fechaString);
            if(isNaN(date.getTime())) return String(fechaString);
            const utcDate = new Date(date.getTime() + date.getTimezoneOffset() * 60000);
            const d = String(utcDate.getDate()).padStart(2, '0');
            const m = String(utcDate.getMonth() + 1).padStart(2, '0');
            const y = utcDate.getFullYear();
            return `${d}/${m}/${y}`;

        const getBase64 = (file) => {
            return new Promise((resolve, reject) => {
                if (!file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = error => reject(error);
                    return;
                }
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1024;
                        let width = img.width; let height = img.height;
                        if (width > MAX_WIDTH) { height = Math.round((height * MAX_WIDTH) / width); width = MAX_WIDTH; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.65));
                    };
                };
                reader.onerror = error => reject(error);
            });
        };

            const handleNavigation = (view) => { setCurrentView(view); window.scrollTo(0, 0); };

            const handleActualizarSkillsClick = () => {
                let improvements = [];
                for (let mov in userSkills) {
                    let nv = userSkills[mov];
                    let ov = maxSkills[mov];
                    let pv = pendingSkills[mov]; // Revisamos si ya está pendiente
                    let isImp = false;

                    // Evaluamos solo si el nivel es estrictamente mayor a lo oficial Y a lo pendiente actual
                    if (gimLevels.includes(nv)) {
                        let nIdx = gimLevels.indexOf(nv);
                        let oIdx = ov ? gimLevels.indexOf(ov) : 0;
                        let pIdx = pv ? gimLevels.indexOf(pv) : 0;
                        if (nIdx > oIdx && nIdx > pIdx) isImp = true;
                    } else if (typeof nv === 'boolean') { 
                        if (nv === true && !ov && !pv) isImp = true;
                    } else if (!isNaN(nv)) {
                        let nVal = Number(nv);
                        let oVal = Number(ov) || 0;
                        let pVal = Number(pv) || 0;
                        if (nVal > oVal && nVal > pVal) isImp = true;
                    }

                    if (isImp) {
                        improvements.push({ mov, newVal: nv, oldVal: ov, file: null, previewUrl: null, type: null });

            const calcularDias = (fechaCaducidad) => {
                if (!fechaCaducidad) return { texto: 'Sin fecha', color: 'text-brand-dark/50' };
                const expDate = new Date(fechaCaducidad);
                if(isNaN(expDate.getTime())) return { texto: 'Inválida', color: 'text-brand-dark/50' };
                const utcDate = new Date(expDate.getTime() + expDate.getTimezoneOffset() * 60000);
                const today = new Date().setHours(0,0,0,0); utcDate.setHours(0,0,0,0);
                const diffDays = Math.ceil((utcDate - today) / (1000 * 60 * 60 * 24));
                if (diffDays < 0) return { texto: `Vencido hace ${Math.abs(diffDays)} días`, color: 'text-red-600' };
                if (diffDays === 0) return { texto: 'Vence HOY', color: 'text-orange-600' };
                if (diffDays <= 5) return { texto: `Vence en ${diffDays} días`, color: 'text-orange-500' };

                if (!urlStr) return <div className="text-brand-dark/50 font-bold text-xs">Sin Evidencia Adjunta</div>;
                if (urlStr === 'Generado Automático' || urlStr === 'Pendiente Revisión (Sin Archivo)') return <div className="text-brand-dark/50 font-bold text-xs bg-black/5 px-4 py-2 rounded-xl">Revisión Manual / Sin Archivo Adjunto</div>;

                        </a>

                                                                newUploads[idx].previewUrl = null;
                                                                setPendingSkillUploads(newUploads);
                                                            }} className="absolute top-0 right-0 bg-red-500 text-white p-1.5 rounded-bl-lg shadow-md"><X style={{ width: '12px', height: '12px' }}/></button>
                                                        </div>
                                                    ) : (
                                                        <button type="button" onClick={() => document.getElementById(`skillFile-${idx}`).click()} className="w-full h-12 rounded-xl bg-white border border-brand-dark/20 border-dashed hover:border-brand-dark transition-colors flex items-center justify-center gap-2 font-black text-brand-dark/50 hover:text-brand-dark text-[10px] uppercase shadow-sm">
                                                            <Camera style={{ width: '16px', height: '16px' }}/> Adjuntar Archivo
                                                        </button>
                                                    )}
                                                    <input type="file" id={`skillFile-${idx}`} accept="image/*,video/*" onChange={(e) => handleSkillFileChange(idx, e)} className="hidden" />
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    
                                    <button onClick={handleSkillEvidenceSubmit} disabled={loading || pendingSkillUploads.some(p => !p.file)} className="w-full bg-brand-dark text-brand-bg1 p-4 rounded-xl font-black uppercase hover:scale-105 shadow-xl transition-transform disabled:opacity-50 mt-4 flex justify-center items-center gap-2">
                                        {loading ? 'Subiendo Archivos...' : <><Upload style={{ width: '16px', height: '16px' }}/> Enviar a Revisión</>}
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* OTROS MODALES EXTRAS (UPLOAD EVIDENCIA RETOS NORMALES) */}
                        {uploadingReto && !uploadingReto.isSkillUpdate && (
                            <div className="fixed inset-0 z-[120] flex items-center justify-center p-4 modal-overlay animate-fade-in">
                                <div className="bg-[#f0e3d1] w-full max-w-sm rounded-[2.5rem] p-6 shadow-2xl relative animate-zoom-in border border-white/20">
                                    <button type="button" onClick={() => {setUploadingReto(null); setPreviewFiles([]); setErrorMsg(''); setSuccessMsg('');}} className="absolute top-4 right-4 z-10 bg-brand-dark/10 text-brand-dark p-2 rounded-full hover:bg-brand-dark/20"><X style={{ width: '16px', height: '16px' }} /></button>
                                    <h3 className="text-xl font-black uppercase mb-2 text-center text-brand-dark pr-6">Enviar Evidencia</h3>
                                    <p className="text-xs font-bold text-brand-dark/60 mb-6 text-center leading-tight uppercase">{uploadingReto.Titulo}</p>
                                    
                                    {successMsg && <div className="bg-yellow-500 text-white p-3 rounded-xl mb-4 text-xs font-bold text-center shadow-md animate-pulse">{successMsg}</div>}
                                    {errorMsg && <div className="bg-red-500 text-white p-3 rounded-xl mb-4 text-xs font-bold text-center shadow-md">{errorMsg}</div>}

                                    <form onSubmit={handleEvidenceSubmit} className="space-y-4">
                                        {previewFiles.length > 0 ? (
                                            <div className="w-full flex flex-col items-center gap-3">
                                                <div className="w-full h-32 bg-black/5 rounded-2xl border border-black/10 overflow-x-auto flex items-center justify-start p-2 gap-2 relative group hide-scroll">
                                                    {previewFiles.map((pf, i) => {
                                                        return (
                                                            <div key={i} className="min-w-[100px] h-full relative rounded-xl overflow-hidden shrink-0 bg-black shadow-sm">
                                                                {pf.type.startsWith('video/') ? (
                                                                    <video src={pf.url} className="w-full h-full object-cover"></video>
                                                                ) : (
                                                                    <img src={pf.url} className="w-full h-full object-cover" />
                                                                )}
                                                                <button type="button" onClick={() => setPreviewFiles(prev => prev.filter((_, idx) => idx !== i))} className="absolute top-1 right-1 bg-red-500 text-white p-1 rounded-full shadow-md"><X style={{ width: '12px', height: '12px' }}/></button>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                                <div className="flex justify-between w-full">
                                                    <button type="button" onClick={() => document.getElementById('galleryInputMulti').click()} className="text-brand-dark font-black text-[10px] uppercase px-3 py-1.5 rounded-lg border border-brand-dark/20 hover:bg-white/50">+ Agregar más</button>
                                                    <button type="button" onClick={() => setPreviewFiles([])} className="bg-black/10 text-brand-dark/60 font-black text-[10px] uppercase px-3 py-1.5 rounded-lg">Limpiar Todo</button>
                                                </div>
                                                <input type="file" id="galleryInputMulti" accept="image/*,video/*" multiple onChange={handleFileChange} className="hidden" />
                                            </div>
                                        ) : (
                                            <div className="flex gap-3 w-full">
                                                <button type="button" onClick={() => document.getElementById('cameraInput').click()} className="flex-1 h-32 rounded-2xl bg-white/60 border-2 border-brand-dark/20 hover:border-brand-dark transition-colors flex flex-col items-center justify-center gap-2 font-black text-brand-dark cursor-pointer shadow-sm">
                                                    <Camera style={{ width: '32px', height: '32px', opacity: 0.7 }} />
                                                    <span className="text-[10px] uppercase tracking-wider">Tomar Foto</span>
                                                </button>
                                                <button type="button" onClick={() => document.getElementById('galleryInput').click()} className="flex-1 h-32 rounded-2xl bg-white/60 border-2 border-brand-dark/20 hover:border-brand-dark transition-colors flex flex-col items-center justify-center gap-2 font-black text-brand-dark cursor-pointer shadow-sm">
                                                    <Upload style={{ width: '32px', height: '32px', opacity: 0.7 }} />
                                                    <span className="text-[10px] uppercase tracking-wider text-center">Adjuntar<br/>Imágenes</span>
                                                </button>
                                                <input type="file" id="cameraInput" accept="image/*" capture="environment" onChange={handleFileChange} className="hidden" />
                                                <input type="file" id="galleryInput" accept="image/*" multiple onChange={handleFileChange} className="hidden" />
                                            </div>
                                        )}
                                        
                                        <button type="submit" disabled={loading || previewFiles.length === 0} className="w-full bg-brand-dark text-brand-bg1 p-4 rounded-xl font-black uppercase hover:scale-105 shadow-xl transition-transform disabled:opacity-50 mt-4">{loading ? 'Procesando...' : 'Enviar a Revisión'}</button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {selectedHistoryItem && (
                            <div className="fixed inset-0 z-[120] flex items-center justify-center p-4 modal-overlay animate-fade-in" onClick={() => setSelectedHistoryItem(null)}>
                                <div className="bg-[#f0e3d1] w-full max-w-md rounded-[2.5rem] p-6 shadow-2xl relative animate-zoom-in border border-white/20" onClick={e => e.stopPropagation()}>
                                    <button type="button" onClick={() => setSelectedHistoryItem(null)} className="absolute top-4 right-4 bg-brand-dark/10 text-brand-dark p-2 rounded-full hover:bg-brand-dark/20 transition-colors"><X style={{ width: '16px', height: '16px' }} /></button>
                                    
                                    <div className="flex items-center gap-3 mb-5 border-b border-brand-dark/10 pb-4 pr-6">
                                        <div className={`w-10 h-10 shrink-0 rounded-full flex items-center justify-center shadow-inner
                                            ${String(selectedHistoryItem.Estado).toLowerCase() === 'aprobado' ? 'bg-green-100 text-green-600' : 
                                              String(selectedHistoryItem.Estado).toLowerCase() === 'rechazado' ? 'bg-red-100 text-red-600' : 
                                              'bg-orange-100 text-orange-600'}`}>
                                            {String(selectedHistoryItem.Estado).toLowerCase() === 'aprobado' ? <CheckCircle style={{ width: '20px', height: '20px' }}/> : 
                                             String(selectedHistoryItem.Estado).toLowerCase() === 'rechazado' ? <X style={{ width: '20px', height: '20px' }}/> : 
                                             <Clock style={{ width: '20px', height: '20px' }}/>}
                                        </div>
                                        <div>
                                            <h3 className="text-lg font-black uppercase text-brand-dark leading-none tracking-tight">Detalle de Solicitud</h3>
                                            <p className="text-[10px] font-bold text-brand-dark/50 mt-1 uppercase">{formatearFecha(selectedHistoryItem.Fecha)}</p>
                                        </div>
                                    </div>

                                    <div className="space-y-4 max-h-[50vh] overflow-y-auto hide-scroll pr-2">
                                        <div>
                                            <span className="text-[9px] font-black uppercase text-brand-dark/50 block mb-1.5">Estado de Revisión</span>
                                            <span className={`inline-block px-3 py-1 rounded-md text-[10px] font-black uppercase tracking-wider shadow-sm border
                                                ${String(selectedHistoryItem.Estado).toLowerCase() === 'aprobado' ? 'bg-green-500/20 text-green-700 border-green-500/30' : 
                                                  String(selectedHistoryItem.Estado).toLowerCase() === 'rechazado' ? 'bg-red-500/20 text-red-700 border-red-500/30' : 
                                                  'bg-orange-500/20 text-orange-700 border-orange-500/30'}`}>
                                                {selectedHistoryItem.Estado}
                                            </span>
                                        </div>

                                        <div>
                                            <span className="text-[9px] font-black uppercase text-brand-dark/50 block mb-2">Desglose de Cambios / Reto</span>
                                            <div className="space-y-2">
                                                {String(selectedHistoryItem.Reto).split(' | ').map((line, i) => {
                                                    return (
                                                        <div key={i} className="bg-white/60 p-3 rounded-xl border border-brand-dark/5 shadow-sm">
                                                            <p className="text-xs font-black text-brand-dark uppercase leading-snug">{String(line).replace('Nueva Marca: ', '')}</p>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>

                                        {selectedHistoryItem.URL_Evidencia && (
                                            <div>
                                                <span className="text-[9px] font-black uppercase text-brand-dark/50 block mb-2">Evidencia Adjunta</span>
                                                <div className="flex flex-wrap items-center gap-2">
                                                    {renderEvidenceLinks(selectedHistoryItem.URL_Evidencia)}
                                                </div>
                                            </div>
                                        )}

                                        {selectedHistoryItem.Puntos > 0 && (
                                            <div className="bg-green-50 p-3 rounded-xl border border-green-100 flex items-center justify-between shadow-sm">
                                                <span className="text-[10px] font-black uppercase text-green-800/60">Puntos Asignados</span>
                                                <span className="font-black text-green-600 text-lg flex items-center gap-1"><Trophy style={{ width: '16px', height: '16px' }}/> +{selectedHistoryItem.Puntos}</span>
                                            </div>
                                        )}

                                        {selectedHistoryItem.Observacion && (
                                            <div>
                                                <span className="text-[9px] font-black uppercase text-brand-dark/50 block mb-1">Comentario del Administrador</span>
                                                <div className="bg-black/5 p-3.5 rounded-xl border border-black/5 relative">
                                                    <div className="absolute left-0 top-0 bottom-0 w-1 bg-brand-dark/20 rounded-l-xl"></div>
                                                    <p className="text-xs font-bold text-brand-dark/80 italic leading-relaxed pl-2">
                                                        "{selectedHistoryItem.Observacion}"
                                                    </p>
                                                </div>
                                            </div>
                                        )}

                                        {String(selectedHistoryItem.Estado).toLowerCase() === 'pendiente' && (
                                            <div className="pt-4 border-t border-brand-dark/10">
                                                <button 
                                                    onClick={() => handleDeleteHistoryItem(selectedHistoryItem)} 
                                                    disabled={deletingHistory}
                                                    className="w-full bg-red-100 text-red-700 p-3.5 rounded-xl font-black uppercase text-[10px] shadow-sm hover:bg-red-200 transition-colors flex items-center justify-center gap-2">
                                                    {deletingHistory ? 'Cancelando...' : <><X style={{ width: '16px', height: '16px' }}/> Cancelar esta Solicitud</>}
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                    </div>
                    {user && currentView !== 'login' && currentView !== 'register' && <BottomNav />}
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
