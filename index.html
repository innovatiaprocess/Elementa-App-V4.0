        const getVideoData = (url) => {
            if (!url) return { type: null, id: null };
            const safeUrl = String(url);
            const ytRegex = new RegExp("^.*(youtu\\.be\\/|v\\/|u\\/\\w\\/|embed\\/|watch\\?v=|\\&v=)([^#\\&\\?]*).*");
            const ytMatch = safeUrl.match(ytRegex);
            if (ytMatch && ytMatch[2].length === 11) return { type: 'youtube', id: ytMatch[2] };
            const driveRegex = new RegExp("(?:\\/d\\/|id=)([a-zA-Z0-9_-]+)");
            const driveMatch = safeUrl.match(driveRegex);
            if (driveMatch) return { type: 'drive', id: driveMatch[1] };
            return { type: null, id: null };
        };

        const formatearFecha = (fechaObj) => {
            if (!fechaObj) return 'N/A';
            let date;
            if (fechaObj.toDate) {
                date = fechaObj.toDate();
            } else {
                date = new Date(fechaObj);
            }
            if(isNaN(date.getTime())) return String(fechaObj);
            const d = String(date.getDate()).padStart(2, '0');
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const y = date.getFullYear();
            return `${d}/${m}/${y}`;
        };

        const getBase64 = (file) => {
            return new Promise((resolve, reject) => {
                if (!file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = error => reject(error);
                    return;
                }
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1024;
                        let width = img.width; let height = img.height;
                        if (width > MAX_WIDTH) { height = Math.round((height * MAX_WIDTH) / width); width = MAX_WIDTH; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                        resolve(dataUrl.split(',')[1]); 
                    };
                };
                reader.onerror = error => reject(error);
            });
        };

        const subirImagenAImgBB = async (base64Data, filename) => {
            try {
                const formData = new FormData();
                formData.append('image', base64Data);
                formData.append('name', filename);

                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                if (data.success) {
                    return data.data.url;
                } else {
                    console.error("Error de ImgBB:", data);
                    return null;
                }
            } catch (error) {
                console.error("Error subiendo a ImgBB:", error);
                return null;
            }

                                            <div className="absolute top-0 left-0 w-2 h-full bg-brand-dark"></div>
                                            <div className="flex justify-between items-start mb-4">
                                                <h3 className="text-2xl font-black uppercase text-brand-dark">{wod.Titulo || 'WOD'}</h3>
                                                <span className="text-xs font-bold text-brand-dark/50 bg-white/50 px-3 py-1 rounded-full">{formatearFecha(wod.Fecha)}</span>
                                            </div>
                                            <div className="bg-white/40 p-5 rounded-xl font-medium text-brand-dark/90 whitespace-pre-wrap leading-relaxed border border-white/50 text-sm">
                                                {wod.Descripcion || 'Sin descripción'}
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                <div className="pt-4 border-t-2 border-brand-dark/10">
                                    <h3 className="font-black text-xl uppercase mb-4 px-2 flex items-center gap-2"><Trophy className="w-5 h-5"/> Retos Disponibles</h3>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        {retosList.map((reto, idx) => (
                                            <div key={idx} className="bg-white/60 p-5 rounded-2xl border border-brand-dark/5 flex flex-col h-full shadow-sm">
                                                <div className="flex justify-between items-start mb-2">
                                                    <h4 className="font-black uppercase text-sm leading-tight text-brand-dark pr-2">{reto.Titulo}</h4>
                                                    <span className="bg-green-100 text-green-700 font-black text-[10px] px-2 py-1 rounded-full uppercase tracking-wider border border-green-200 shrink-0">+{reto.Puntos} Pts</span>
                                                </div>
                                                <p className="text-xs font-bold text-brand-dark/60 mb-4 flex-1 leading-relaxed">{reto.Descripcion}</p>
                                                <button onClick={() => setUploadingReto({ Titulo: reto.Titulo, Puntos: reto.Puntos })} className="w-full bg-brand-dark text-brand-bg1 py-2.5 rounded-xl font-black text-[10px] uppercase shadow-md flex items-center justify-center gap-2 hover:scale-[1.02] transition-transform">
                                                    <Upload className="w-4 h-4"/> Subir Evidencia
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* VISTA: ACADEMIA DE VIDEOS */}
                        {user && currentView === 'academy' && (
                            <div className="animate-slide-up space-y-6">
                                <div className="px-2 mt-4">
                                    <h2 className="text-4xl font-black uppercase leading-none mt-1">Academia</h2>
                                    <p className="text-sm font-bold text-brand-dark/50 mt-2">Domina tu técnica con nuestros videos</p>
                                </div>
                                <div className="relative">
                                    <Search className="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-brand-dark/50" />
                                    <input type="text" placeholder="Buscar movimiento..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full pl-12 pr-4 py-4 rounded-2xl bg-white/60 focus:bg-white outline-none transition-all shadow-inner font-bold text-brand-dark" />
                                </div>
                                <div className="space-y-4">
                                    {Object.keys(groupedFilteredVideos).map((category, catIdx) => (
                                        <div key={catIdx} className="glass-card rounded-[1.5rem] overflow-hidden border border-white/40 shadow-sm">
                                            <button onClick={() => toggleCategory(category)} className="w-full p-5 flex justify-between items-center hover:bg-white/40 transition-colors">
                                                <div className="flex items-center gap-3">
                                                    <div className="bg-brand-dark text-brand-bg1 w-8 h-8 rounded-full flex items-center justify-center font-black text-sm shadow-inner">{groupedFilteredVideos[category].length}</div>
                                                    <h3 className="font-black text-lg uppercase tracking-wider">Categoría {category}</h3>
                                                </div>
                                                {expandedCategories[category] ? <ChevronUp className="w-5 h-5 opacity-50"/> : <ChevronDown className="w-5 h-5 opacity-50"/>}
                                            </button>
                                            {expandedCategories[category] && (
                                                <div className="p-4 sm:p-6 grid grid-cols-1 sm:grid-cols-2 gap-6 bg-black/5 animate-fade-in border-t border-white/20">
                                                    {groupedFilteredVideos[category].map((vid, vIdx) => {
                                                        const videoInfo = getVideoData(vid.URL);
                                                        return (
                                                            <div key={vIdx} onClick={() => setSelectedVideo({ ...videoInfo, Nombre: vid.Nombre })} className="bg-white rounded-3xl overflow-hidden shadow-sm border border-brand-dark/5 flex flex-col group relative cursor-pointer hover:shadow-xl hover:-translate-y-1 transition-all duration-300">
                                                                <div className="relative aspect-video bg-brand-dark flex items-center justify-center overflow-hidden">
                                                                    {videoInfo.type === 'youtube' ? (
                                                                        <img src={`https://img.youtube.com/vi/${videoInfo.id}/hqdefault.jpg`} className="absolute inset-0 w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity duration-500 group-hover:scale-105" alt={vid.Nombre} />
                                                                    ) : (
                                                                        <Video className="w-12 h-12 text-white/30" />
                                                                    )}
                                                                </div>
                                                                <div className="p-5 flex-1 flex flex-col">
                                                                    <h4 className="font-black text-xl leading-tight uppercase mb-2 text-brand-dark">{vid.Nombre}</h4>
                                                                    <p className="text-sm text-brand-dark/70 font-medium line-clamp-2 mt-auto">{vid.Descripcion}</p>
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* VISTA: BLOG / EVENTOS */}
                        {user && currentView === 'blog' && (
                            <div className="animate-slide-up space-y-6">
                                <div className="px-2 mt-4">
                                    <h2 className="text-4xl font-black uppercase leading-none mt-1">Eventos</h2>
                                    <p className="text-sm font-bold text-brand-dark/50 mt-2">Actividades extraordinarias y comunidad</p>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
                                    {blogPosts.map((post, idx) => (
                                        <div key={idx} onClick={() => setSelectedPost(post)} className="bg-white rounded-2xl overflow-hidden group hover:shadow-xl transition-all duration-300 relative cursor-pointer flex flex-col border border-brand-dark/10 shadow-sm">
                                            <div className="h-32 sm:h-40 w-full bg-brand-dark/5 flex items-center justify-center">
                                                <BookOpen className="w-8 h-8 text-brand-dark/20" />
                                            </div>
                                            <div className="p-4 flex-1 flex flex-col">
                                                <div className="flex justify-between items-center mb-2">
                                                    <span className="bg-brand-dark text-brand-bg1 px-2 py-0.5 rounded text-[8px] font-black uppercase tracking-wider">Evento</span>
                                                    <span className="text-[9px] font-bold text-brand-dark/50 uppercase">{formatearFecha(post.Fecha)}</span>
                                                </div>
                                                <h3 className="text-sm font-black leading-tight mb-1.5 text-brand-dark">{post.Titulo}</h3>
                                                <p className="font-medium text-brand-dark/60 text-[10px] mb-3 line-clamp-2 leading-relaxed">{post.Descripcion}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* VISTA: ADMIN PANEL */}
                        {user && currentView === 'admin' && user?.role === 'admin' && (
                            <div className="animate-slide-up space-y-6">
                                <div className="px-2 mt-4"><h2 className="text-4xl font-black uppercase leading-none mt-1">Panel Admin</h2></div>
                                
                                <div className="glass-card p-4 sm:p-6 rounded-[2rem] border border-white/40">
                                    <h3 className="text-xl font-black flex items-center gap-2 mb-6"><CheckCircle className="w-5 h-5"/> Evidencias Pendientes</h3>
                                    
                                    <div className="space-y-3">
                                        {adminEvidencias.length === 0 ? (
                                            <p className="text-center font-bold text-brand-dark/50 py-8 bg-white/40 rounded-2xl border border-white">No hay evidencias pendientes por revisar.</p>
                                        ) : (
                                            adminEvidencias.map((ev, i) => (
                                                <div key={i} className="bg-white/60 p-4 rounded-2xl border border-brand-dark/10 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 shadow-sm">
                                                    <div className="flex-1 min-w-0 pr-4">
                                                        <div className="flex items-center gap-2 mb-1.5">
                                                            <span className="px-2 py-0.5 rounded text-[9px] font-black uppercase tracking-wider bg-orange-100 text-orange-700">Pendiente</span>
                                                            <span className="text-[10px] font-black uppercase text-brand-dark/50">{formatearFecha(ev.Fecha)}</span>
                                                        </div>
                                                        <p className="font-black text-brand-dark text-xs leading-tight uppercase">{ev.Reto}</p>
                                                        <p className="text-[10px] font-bold text-brand-dark/60 mt-1 flex items-center gap-1"><Users className="w-3 h-3"/> {ev.Atleta} ({ev.Correo})</p>
                                                        
                                                        {ev.URL_Evidencia && ev.URL_Evidencia !== 'Sin archivo' && (
                                                            <a href={ev.URL_Evidencia} target="_blank" className="inline-block mt-2 bg-blue-100 text-blue-700 px-3 py-1 rounded-full font-black text-[10px] uppercase border border-blue-200">
                                                                Ver Imagen Adjunta
                                                            </a>
                                                        )}
                                                    </div>
                                                    <div className="flex flex-col gap-2 w-full sm:w-auto">
                                                        <button onClick={() => handleAdminValidateEvidence(ev, 'Aprobado', ev.Puntos)} className="w-full bg-green-500 text-white px-4 py-2 rounded-xl font-black text-[10px] uppercase shadow-md hover:bg-green-600">Aprobar (+{ev.Puntos})</button>
                                                        <button onClick={() => handleAdminValidateEvidence(ev, 'Rechazado', 0)} className="w-full bg-red-100 text-red-700 px-4 py-2 rounded-xl font-black text-[10px] uppercase border border-red-200 hover:bg-red-200">Rechazar</button>
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* MODALES ADICIONALES (PERFIL Y UPLOAD) */}
                        {showProfileModal && (
                            <div className="fixed inset-0 z-[120] flex items-center justify-center p-4 modal-overlay animate-fade-in">
                                <div className="bg-[#f0e3d1] w-full max-w-lg rounded-[2.5rem] p-6 shadow-2xl relative animate-zoom-in border border-white/20 max-h-[90vh] flex flex-col">
                                    <button type="button" onClick={() => setShowProfileModal(false)} className="absolute top-4 right-4 z-10 bg-brand-dark/10 text-brand-dark p-2 rounded-full hover:bg-brand-dark/20"><X className="w-4 h-4" /></button>
                                    <div className="mb-4 text-center">
                                        <h3 className="text-2xl font-black uppercase text-brand-dark">Mi Perfil</h3>
                                    </div>
                                    <div className="flex-1 overflow-y-auto hide-scroll pr-1 pb-4">
                                        <form onSubmit={handleUpdateProfile} className="space-y-4">
                                            <div className="grid grid-cols-2 gap-4">
                                                <div><label className="block text-[10px] font-black mb-1 ml-1 uppercase text-brand-dark">Nombres</label><input type="text" name="nombres" defaultValue={user.nombres} className="w-full p-3.5 rounded-xl bg-white/60 focus:bg-white outline-none font-bold text-brand-dark" /></div>
                                                <div><label className="block text-[10px] font-black mb-1 ml-1 uppercase text-brand-dark">Apellidos</label><input type="text" name="apellidos" defaultValue={user.apellidos} className="w-full p-3.5 rounded-xl bg-white/60 focus:bg-white outline-none font-bold text-brand-dark" /></div>
                                            </div>
                                            <button type="submit" className="w-full bg-brand-dark text-brand-bg1 p-4 rounded-xl font-black text-sm uppercase tracking-wider mt-4">Guardar Perfil</button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        )}

                        {uploadingReto && (
                            <div className="fixed inset-0 z-[120] flex items-center justify-center p-4 modal-overlay animate-fade-in">
                                <div className="bg-[#f0e3d1] w-full max-w-sm rounded-[2.5rem] p-6 shadow-2xl relative animate-zoom-in border border-white/20">
                                    <button type="button" onClick={() => {setUploadingReto(null); setPreviewFiles([]);}} className="absolute top-4 right-4 z-10 bg-brand-dark/10 text-brand-dark p-2 rounded-full hover:bg-brand-dark/20"><X className="w-4 h-4" /></button>
                                    <h3 className="text-xl font-black uppercase mb-2 text-center text-brand-dark pr-6">Enviar Evidencia</h3>
                                    <p className="text-xs font-bold text-brand-dark/60 mb-6 text-center leading-tight uppercase">{uploadingReto.Titulo}</p>
                                    
                                    <form onSubmit={handleEvidenceSubmit} className="space-y-4">
                                        {previewFiles.length > 0 ? (
                                            <div className="w-full flex flex-col items-center gap-3">
                                                <div className="w-32 h-32 relative rounded-xl overflow-hidden shrink-0 bg-black shadow-sm mx-auto">
                                                    <img src={previewFiles[0].url} className="w-full h-full object-cover" />
                                                </div>
                                                <button type="button" onClick={() => setPreviewFiles([])} className="bg-black/10 text-brand-dark/60 font-black text-[10px] uppercase px-3 py-1.5 rounded-lg">Cambiar Foto</button>
                                            </div>
                                        ) : (
                                            <div className="flex gap-3 w-full">
                                                <button type="button" onClick={() => document.getElementById('cameraInput').click()} className="flex-1 h-32 rounded-2xl bg-white/60 border-2 border-brand-dark/20 flex flex-col items-center justify-center gap-2 font-black text-brand-dark shadow-sm">
                                                    <Camera className="w-8 h-8 opacity-70" />
                                                    <span className="text-[10px] uppercase">Tomar Foto</span>
                                                </button>
                                                <input type="file" id="cameraInput" accept="image/*" onChange={handleFileChange} className="hidden" />
                                            </div>
                                        )}
                                        <button type="submit" disabled={loading || previewFiles.length === 0} className="w-full bg-brand-dark text-brand-bg1 p-4 rounded-xl font-black uppercase disabled:opacity-50 mt-4">{loading ? 'Procesando...' : 'Enviar a Revisión'}</button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {selectedVideo && (
                            <div className="fixed inset-0 z-[120] flex items-center justify-center p-4 modal-overlay animate-fade-in" onClick={() => setSelectedVideo(null)}>
                                <div className="bg-black w-full max-w-4xl rounded-3xl overflow-hidden shadow-2xl relative aspect-video flex flex-col" onClick={e => e.stopPropagation()}>
                                    <button onClick={() => setSelectedVideo(null)} className="absolute top-4 right-4 z-30 bg-black/50 text-white p-2 rounded-full hover:bg-black transition-colors"><X className="w-5 h-5" /></button>
                                    <div className="flex-1 w-full h-full relative">
                                        {selectedVideo.type === 'youtube' && <iframe src={`https://www.youtube.com/embed/${selectedVideo.id}?autoplay=1`} className="absolute inset-0 w-full h-full border-0" allow="autoplay; fullscreen"></iframe>}
                                    </div>
                                </div>
                            </div>
                        )}

                        {selectedPost && (
                            <div className="fixed inset-0 z-[120] flex items-center justify-center p-4 modal-overlay animate-fade-in" onClick={() => setSelectedPost(null)}>
                                <div className="bg-[#f0e3d1] w-full max-w-lg rounded-[2.5rem] p-6 shadow-2xl relative animate-zoom-in" onClick={e => e.stopPropagation()}>
                                    <button onClick={() => setSelectedPost(null)} className="absolute top-4 right-4 bg-brand-dark/10 p-2 rounded-full"><X className="w-5 h-5" /></button>
                                    <h2 className="text-2xl font-black text-brand-dark mb-4 mt-2 pr-6">{selectedPost.Titulo}</h2>
                                    <div className="text-brand-dark/90 font-medium whitespace-pre-wrap max-h-[60vh] overflow-y-auto">
                                        {selectedPost.Descripcion}
                                    </div>
                                </div>
                            </div>
                        )}

                    </div>
                    {user && currentView !== 'login' && <BottomNav />}
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
