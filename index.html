        const getVideoData = (url) => {
            if (!url) return { type: null, id: null };
            const safeUrl = String(url);

        const formatearFecha = (fechaObj) => {
            if (!fechaObj) return 'N/A';
            let date;
            if (fechaObj.toDate) date = fechaObj.toDate();
            else date = new Date(fechaObj);
            if(isNaN(date.getTime())) return String(fechaObj);
            return `${String(date.getDate()).padStart(2, '0')}/${String(date.getMonth() + 1).padStart(2, '0')}/${date.getFullYear()}`;

        const calcularDias = (fechaCaducidad) => {
            if (!fechaCaducidad) return { texto: 'Sin fecha', color: 'text-brand-dark/50' };
            const expDate = fechaCaducidad.toDate ? fechaCaducidad.toDate() : new Date(fechaCaducidad);
            if(isNaN(expDate.getTime())) return { texto: 'Inválida', color: 'text-brand-dark/50' };
            const today = new Date().setHours(0,0,0,0); 
            expDate.setHours(0,0,0,0);
            const diffDays = Math.ceil((expDate - today) / (1000 * 60 * 60 * 24));
            if (diffDays < 0) return { texto: `Vencido hace ${Math.abs(diffDays)} días`, color: 'text-red-600' };
            if (diffDays === 0) return { texto: 'Vence HOY', color: 'text-orange-600' };
            if (diffDays <= 5) return { texto: `Vence en ${diffDays} días`, color: 'text-orange-500' };
            return { texto: `${diffDays} días restantes`, color: 'text-green-600' };
        };

        const getBase64 = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1024;
                        let width = img.width; let height = img.height;
                        if (width > MAX_WIDTH) { height = Math.round((height * MAX_WIDTH) / width); width = MAX_WIDTH; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.8).split(',')[1]); // Only get base64 data
                    };
                };
                reader.onerror = error => reject(error);
            });
        };

        .border-band-verde { border-color: #22c55e; color: #22c55e; box-shadow: inset 0 0 8px rgba(34, 197, 94, 0.2); }
        .border-band-morada { border-color: #9333ea; color: #9333ea; box-shadow: inset 0 0 8px rgba(147, 51, 234, 0.2); }
        .border-band-negra { border-color: #1f2937; color: #1f2937; box-shadow: inset 0 0 8px rgba(31, 41, 55, 0.2); }
        .border-band-roja { border-color: #ef4444; color: #ef4444; box-shadow: inset 0 0 8px rgba(239, 68, 68, 0.2); }
        .border-band-sin { border-color: #eab308; color: #eab308; box-shadow: inset 0 0 8px rgba(234, 179, 8, 0.2); }

        @keyframes element-pulse { 0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.5; } 50% { transform: scale(1.3) rotate(90deg); opacity: 0.9; } }
        .orb-aura { position: absolute; width: 100%; height: 100%; border-radius: 40%; filter: blur(35px); z-index: 0; mix-blend-mode: multiply; }
        .aura-fire { background: #ef4444; animation: element-pulse 4s ease-in-out infinite; top: -10%; left: -10%; }
        .aura-water { background: #3b82f6; animation: element-pulse 5s ease-in-out infinite alternate; animation-delay: -1s; bottom: -10%; right: -10%; }
        .aura-earth { background: #22c55e; animation: element-pulse 6s ease-in-out infinite; animation-delay: -2s; bottom: -10%; left: -10%; }
        .aura-air { background: #cbd5e1; animation: element-pulse 4.5s ease-in-out infinite alternate; animation-delay: -3s; top: -10%; right: -10%; }
        
        @keyframes float-logo { 0%, 100% { transform: translateY(0); filter: drop-shadow(0 15px 25px rgba(0,0,0,0.3)); } 50% { transform: translateY(-15px); filter: drop-shadow(0 30px 40px rgba(0,0,0,0.15)); } }
        .animate-float { animation: float-logo 4s ease-in-out infinite; }       
        `;

        const GlobalLoader = () => (
            <div className="fixed inset-0 z-[999999] bg-[#E5D3BD]/95 backdrop-blur-xl flex flex-col items-center justify-center animate-fade-in" style={{ pointerEvents: 'all' }}>
                <div className="relative flex items-center justify-center mb-16 w-64 h-64 sm:w-80 sm:h-80">
                    <div className="absolute inset-0">
                        <div className="orb-aura aura-fire"></div><div className="orb-aura aura-water"></div>
                        <div className="orb-aura aura-earth"></div><div className="orb-aura aura-air"></div>
                    </div>
                    <div className="w-48 h-48 sm:w-64 sm:h-64 relative z-10 animate-float rounded-full overflow-hidden shadow-[0_0_40px_rgba(0,0,0,0.3)] border-4 border-[#E5D3BD]/50">
                        <img src="https://lh3.googleusercontent.com/d/1CDtlPBzeohniETytbfVOI43VMmk_vQTn" alt="Elementa Logo" className="w-full h-full object-cover scale-[1.05]" />
                    </div>
                </div>
                
                <div className="text-brand-dark font-black uppercase tracking-[0.3em] text-sm animate-pulse flex flex-col items-center gap-3">
                    <span>Sincronizando Elementos</span>
                    <div className="flex gap-2">
                        <div className="w-2.5 h-2.5 rounded-full bg-red-500 animate-bounce shadow-md" style={{animationDelay: '0s'}}></div>
                        <div className="w-2.5 h-2.5 rounded-full bg-blue-500 animate-bounce shadow-md" style={{animationDelay: '0.15s'}}></div>
                        <div className="w-2.5 h-2.5 rounded-full bg-green-500 animate-bounce shadow-md" style={{animationDelay: '0.3s'}}></div>
                        <div className="w-2.5 h-2.5 rounded-full bg-slate-300 animate-bounce shadow-md" style={{animationDelay: '0.45s'}}></div>
                    </div>
                </div>
            </div>
        );

        function App() {
            const [user, setUser] = useState(null); 
            const [currentView, setCurrentView] = useState('login'); 
            const [loading, setLoading] = useState(false);
            const [dataLoading, setDataLoading] = useState(true); 
            const [errorMsg, setErrorMsg] = useState('');
            const [successMsg, setSuccessMsg] = useState('');

            // Datos
            const [videos, setVideos] = useState([]);
            const [blogPosts, setBlogPosts] = useState([]);
            const [misPuntos, setMisPuntos] = useState(0);
            const [retosList, setRetosList] = useState([]);
            const [rankingList, setRankingList] = useState([]);
            const [wodsList, setWodsList] = useState([]); 
            
            // UI State
            const [searchTerm, setSearchTerm] = useState('');
            const [expandedCategories, setExpandedCategories] = useState({});
            const [selectedPost, setSelectedPost] = useState(null); 
            const [selectedVideo, setSelectedVideo] = useState(null); 
            const [uploadingReto, setUploadingReto] = useState(null);
            const [previewFiles, setPreviewFiles] = useState([]);
            const [showProfileModal, setShowProfileModal] = useState(false);

            // Skills State
            const [skillTab, setSkillTab] = useState('gimnasia'); 
            const [userSkills, setUserSkills] = useState(defaultSkills); 
            const [maxSkills, setMaxSkills] = useState(defaultSkills);
            const [pendingSkills, setPendingSkills] = useState({});
            const [history, setHistory] = useState([]);
            const [selectedHistoryItem, setSelectedHistoryItem] = useState(null);

            // Admin State
            const [adminTab, setAdminTab] = useState('evidencias'); 
            const [adminSheetData, setAdminSheetData] = useState([]);
            const [adminEvidencias, setAdminEvidencias] = useState([]);
            const [editingPayment, setEditingPayment] = useState(null);
            const [adminEvalEvidencia, setAdminEvalEvidencia] = useState(null);
            
            const [editingEvent, setEditingEvent] = useState(null);
            const [editingWOD, setEditingWOD] = useState(null);
            const [editingReto, setEditingReto] = useState(null);
            const [editingVideo, setEditingVideo] = useState(null);

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(async (firebaseUser) => {
                    if (firebaseUser) {
                        const email = firebaseUser.email.toLowerCase();
                        
                        // Escuchar el documento del usuario
                        db.collection('usuarios').doc(email).onSnapshot((doc) => {
                            if (doc.exists) {
                                const userData = doc.data();
                                const combinedUser = { email: firebaseUser.email, correo: firebaseUser.email, ...userData };
                                setUser(combinedUser);
                                setMisPuntos(userData.puntos || 0);
                                if (userData.skills) setMaxSkills({...defaultSkills, ...userData.skills});
                                setCurrentView(prev => prev === 'login' ? 'home' : prev);
                            } else {
                                // Crear usuario nuevo
                                const today = new Date().toISOString().split('T')[0];
                                db.collection('usuarios').doc(email).set({
                                    correo: email, Nombres: firebaseUser.displayName || '', role: 'user', 
                                    Estado: 'Activo', Plan: 'Sin Plan', Ingreso: today,
                                    diasRestantes: 0, puntos: 0, skills: defaultSkills
                                });
                            }
                            setDataLoading(false);
                            setLoading(false);
                        });

                        loadRealtimeData(email);

                    } else {
                        setUser(null);
                        setCurrentView('login');
                        setDataLoading(false);
                        setLoading(false); 
                    }
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (user && currentView === 'home' && (!user.Cedula || !user.Telefono)) {
                    setShowProfileModal(true);
                }
            }, [user, currentView]);

            const loadRealtimeData = (email) => {
                // Escuchar WODs
                db.collection('wods').orderBy('Fecha', 'desc').onSnapshot(snap => {
                    setWodsList(snap.docs.map(d => ({id: d.id, ...d.data()})));
                });

                // Escuchar Eventos/Blog
                db.collection('eventos').orderBy('Fecha', 'desc').onSnapshot(snap => {
                    setBlogPosts(snap.docs.map(d => ({id: d.id, ...d.data()})));
                });
                
                // Escuchar Videos
                db.collection('videos').onSnapshot(snap => {
                    const vids = snap.docs.map(d => ({id: d.id, ...d.data()}));
                    setVideos(vids);
                    if (vids.length > 0 && Object.keys(expandedCategories).length === 0) {
                        setExpandedCategories({ [vids[0].Categoria || 'General']: true });
                    }
                });

                // Escuchar Retos
                db.collection('retos').onSnapshot(snap => {
                    setRetosList(snap.docs.map(d => ({id: d.id, ...d.data()})));
                });

                // Escuchar Evidencias y Pendientes del Usuario
                db.collection('evidencias').where('Correo', '==', email).onSnapshot(snap => {
                    const evids = snap.docs.map(d => ({id: d.id, ...d.data()}));
                    evids.sort((a,b) => (b.Fecha?.toDate ? b.Fecha.toDate() : new Date(b.Fecha)) - (a.Fecha?.toDate ? a.Fecha.toDate() : new Date(a.Fecha))); 
                    setHistory(evids);

                    let pendientes = {};
                    evids.forEach(ev => {
                        if(ev.Estado === 'Pendiente' && ev.Datos_JSON) {
                            try { Object.assign(pendientes, JSON.parse(ev.Datos_JSON)); } catch(e){}
                        }
                    });
                    setPendingSkills(pendientes);

                    // Actualizar UI Skills visualmente combinando oficiales + pendientes
                    setUserSkills(prev => {
                        let ui = { ...maxSkills };
                        for(let mov in pendientes) {
                            if (gimLevels.includes(pendientes[mov])) {
                                if (gimLevels.indexOf(pendientes[mov]) > gimLevels.indexOf(ui[mov] || 'verde')) ui[mov] = pendientes[mov];
                            } else if (typeof pendientes[mov] === 'boolean') {
                                if (pendientes[mov] === true) ui[mov] = true;
                            } else if (!isNaN(pendientes[mov])) {
                                if (Number(pendientes[mov]) > Number(ui[mov] || 0)) ui[mov] = Number(pendientes[mov]);
                            }
                        }
                        return ui;
                    });
                });

                // Escuchar Ranking y Datos Admin
                db.collection('usuarios').onSnapshot(snap => {
                    const allUsers = snap.docs.map(d => ({id: d.id, ...d.data()}));
                    setAdminSheetData(allUsers);
                    const rank = allUsers.map(u => ({
                        nombre: `${u.Nombres || ''} ${u.Apellidos || ''}`.trim() || u.correo,
                        puntos: u.puntos || 0
                    })).filter(u => u.nombre && u.puntos > 0).sort((a,b) => b.puntos - a.puntos);
                    setRankingList(rank);
                });

                // Evidencias Admin
                db.collection('evidencias').where('Estado', '==', 'Pendiente').onSnapshot(snap => {
                    setAdminEvidencias(snap.docs.map(d => ({id: d.id, ...d.data()})));
                });
            };

            const handleGoogleAuth = async () => {
                setLoading(true); setErrorMsg('');
                try {
                    await auth.signInWithPopup(googleProvider);
                } catch(err) {
                    if(err.code !== 'auth/popup-closed-by-user') setErrorMsg("Error al conectar: " + err.message);
                    setLoading(false);
                }
            };

            const handleLogout = async () => { await auth.signOut(); };

            const handleUpdateProfile = async (e) => {
                e.preventDefault(); setLoading(true); setErrorMsg(''); setSuccessMsg('');
                const formData = new FormData(e.target);
                const data = Object.fromEntries(formData.entries());
                
                try {
                    await db.collection('usuarios').doc(user.correo).update(data);
                    setSuccessMsg("¡Perfil actualizado!");
                    setTimeout(() => { setShowProfileModal(false); setSuccessMsg(''); }, 1500);
                } catch (error) { setErrorMsg("Error: " + error.message); }
                setLoading(false);
            };

            const handleActualizarSkillsClick = () => {
                let hasImprovements = false;
                let ptsGanados = 0;
                let descCambios = [];
                let changesJSON = {};

                for (let mov in userSkills) {
                    let nv = userSkills[mov];
                    let ov = maxSkills[mov];

                    // Gimnasia Bandas
                    if (gimLevels.includes(nv)) {
                        let nIdx = gimLevels.indexOf(nv); let oIdx = ov ? gimLevels.indexOf(ov) : 0;
                        if (nIdx > oIdx) {
                            hasImprovements = true;
                            ptsGanados += (reglasPuntos.gimnasiaBandas[nv] || 0) - (reglasPuntos.gimnasiaBandas[gimLevels[oIdx]] || 0);
                            descCambios.push(`${mov} (${(ov||'verde').toUpperCase()} -> ${nv.toUpperCase()})`);
                            changesJSON[mov] = nv;
                        }
                    } 
                    // Gimnasia Plana
                    else if (typeof nv === 'boolean') {
                        if (nv === true && !ov) {
                            hasImprovements = true;
                            ptsGanados += reglasPuntos.gimnasiaPlana[mov] || 0;
                            descCambios.push(`${mov} (Logro Desbloqueado)`);
                            changesJSON[mov] = true;
                        }
                    } 
                    // Levantamientos
                    else if (!isNaN(nv) && nv !== '') {
                        let nVal = Number(nv); let oVal = Number(ov) || 0;
                        let increment = nVal - oVal;
                        let reglaLev = reglasPuntos.levantamiento[mov] || { inc: 5, pts: 5 }; // Default fallback

                        if (increment >= reglaLev.inc) {
                            hasImprovements = true;
                            ptsGanados += reglaLev.pts;
                            descCambios.push(`${mov} (${oVal} -> ${nVal} LBS)`);
                            changesJSON[mov] = nVal;
                        } else if (increment > 0 && increment < reglaLev.inc) {
                            // Se guarda silenciosamente sin puntos
                            maxSkills[mov] = nVal;
                        }
                    }
                }

                if (hasImprovements) {
                    setUploadingReto({ 
                        Titulo: 'Validación de Nuevas Marcas | ' + descCambios.join(' | '), 
                        Puntos: ptsGanados, 
                        isSkillUpdate: true,
                        changesJSON: JSON.stringify(changesJSON)
                    });
                } else {
                    handleSaveSkillsSilently();
                }
            };

            const handleSaveSkillsSilently = async () => {
                setLoading(true); setErrorMsg(''); setSuccessMsg('');
                try {
                    await db.collection('usuarios').doc(user.correo).update({ skills: { ...maxSkills, ...userSkills } });
                    setSuccessMsg('Progreso guardado (Las marcas inferiores no otorgan puntos ni requieren evidencia).');
                } catch(e) { setErrorMsg('Error al guardar el progreso.'); }
                setLoading(false);
                setTimeout(() => { setSuccessMsg(''); setErrorMsg(''); }, 4000);
            };

            const handleFileChange = (e) => {
                const files = Array.from(e.target.files);
                if(files.length > 0) { 
                    const newFiles = files.map((file) => ({
                        url: URL.createObjectURL(file), type: file.type, originalFile: file
                    }));
                    setPreviewFiles((prev) => [...prev, ...newFiles]); 
                } 
            };

            const handleEvidenceSubmit = async (e) => {
                e.preventDefault(); setLoading(true); setSuccessMsg('Procesando (esto puede tardar unos segundos)...'); setErrorMsg('');
                
                try {
                    let urls = [];
                    if (previewFiles.length > 0) {
                        for(let pf of previewFiles) {
                            if(pf.originalFile.size > 8 * 1024 * 1024) { 
                                setErrorMsg("Una imagen es muy pesada (Máximo 8MB)."); setLoading(false); setSuccessMsg(''); return; 
                            }
                            const b64 = await getBase64(pf.originalFile);
                            const imgUrl = await subirImagenAImgBB(b64, pf.originalFile.name || 'evidencia');
                            if (imgUrl) urls.push(imgUrl);
                        }
                    }

                    if(urls.length === 0) {
                        setErrorMsg("Error al subir a ImgBB. Intenta de nuevo."); setLoading(false); setSuccessMsg(''); return;
                    }

                    await db.collection('evidencias').add({
                        Correo: user.correo,
                        Atleta: `${user.Nombres} ${user.Apellidos || ''}`.trim(),
                        Reto: uploadingReto.Titulo,
                        Puntos: uploadingReto.Puntos,
                        URL_Evidencia: urls.join(' | '),
                        Fecha: firebase.firestore.FieldValue.serverTimestamp(),
                        Estado: 'Pendiente',
                        Observacion: '',
                        Datos_JSON: uploadingReto.changesJSON || ''
                    });

                    setSuccessMsg('Evidencia enviada a revisión.');
                    setTimeout(() => { setUploadingReto(null); setPreviewFiles([]); setSuccessMsg(''); }, 2000);
                    
                } catch(err) { setErrorMsg("Error: " + err.message); setSuccessMsg('');}
                setLoading(false);
            };

            const completeVideoChallenge = async () => {
                setLoading(true);
                try {
                    await db.collection('evidencias').add({
                        Correo: user.correo,
                        Atleta: `${user.Nombres} ${user.Apellidos || ''}`.trim(),
                        Reto: `Ver video: ${selectedVideo.Nombre || 'Academia'}`,
                        Puntos: 1,
                        URL_Evidencia: 'Generado Automático',
                        Fecha: firebase.firestore.FieldValue.serverTimestamp(),
                        Estado: 'Aprobado',
                        Observacion: 'Validación Automática del Sistema'
                    });
                    await db.collection('usuarios').doc(user.correo).update({
                        puntos: firebase.firestore.FieldValue.increment(1)
                    });
                    setSuccessMsg('Puntos asignados exitosamente.');
                    setTimeout(() => { setSelectedVideo(null); setSuccessMsg(''); }, 1500);
                } catch(e) { setErrorMsg("Error al asignar puntos."); }
                setLoading(false);
            };

            const handleAdminValidateEvidence = async (e, estadoDecision) => {
                e.preventDefault(); setLoading(true);
                const form = e.target.closest('form');
                const observacion = form.observacion.value;
                
                if (estadoDecision === 'Rechazado' && !observacion) { 
                    setErrorMsg("Debe seleccionar una observación para rechazar."); setLoading(false); return; 
                }

                try {
                    await db.collection('evidencias').doc(adminEvalEvidencia.id).update({
                        Estado: estadoDecision,
                        Observacion: observacion,
                        Puntos: estadoDecision === 'Aprobado' ? adminEvalEvidencia.Puntos : 0
                    });

                    if (estadoDecision === 'Aprobado') {
                        // Incrementar Puntos
                        const userRef = db.collection('usuarios').doc(adminEvalEvidencia.Correo);
                        await userRef.update({ puntos: firebase.firestore.FieldValue.increment(adminEvalEvidencia.Puntos) });

                        // Fusionar Skills si existen
                        if (adminEvalEvidencia.Datos_JSON) {
                            const newSkillsPending = JSON.parse(adminEvalEvidencia.Datos_JSON);
                            const userDoc = await userRef.get();
                            let currentSkills = userDoc.data().skills || defaultSkills;
                            
                            for (let m in newSkillsPending) {
                                let nv = newSkillsPending[m];
                                let ov = currentSkills[m];
                                
                                if (gimLevels.includes(nv)) {
                                    if (!ov || gimLevels.indexOf(nv) > gimLevels.indexOf(ov)) currentSkills[m] = nv;
                                } else if (typeof nv === 'boolean') {
                                    if (nv === true) currentSkills[m] = true;
                                } else {
                                    if (!ov || Number(nv) > Number(ov)) currentSkills[m] = Number(nv);
                                }
                            }
                            await userRef.update({ skills: currentSkills });
                        }
                    }

                    setSuccessMsg(`Evidencia ${estadoDecision} correctamente.`);
                    setAdminEvalEvidencia(null);
                } catch(err) { setErrorMsg("Error: " + err.message); }
                setLoading(false);
                setTimeout(() => { setSuccessMsg(''); setErrorMsg(''); }, 3000);
            };

            const handlePaymentUpdate = async (e) => {
                e.preventDefault(); setLoading(true);
                const formData = new FormData(e.target);
                const data = Object.fromEntries(formData.entries());
                try {
                    await db.collection('usuarios').doc(editingPayment.id).update(data);
                    setSuccessMsg('Atleta actualizado.');
                    setTimeout(() => { setSuccessMsg(''); setEditingPayment(null); }, 1500);
                } catch(err) { setErrorMsg(err.message); }
                setLoading(false);
            };

            const handleAdminFormSubmit = async (e, collection, editObj, setEditObj) => {
                e.preventDefault(); setLoading(true); setErrorMsg(''); setSuccessMsg('');
                const formData = new FormData(e.target);
                const data = Object.fromEntries(formData.entries());
                if (data.Destacado === 'on') data.Destacado = 'SI'; else data.Destacado = '';
                
                try {
                    if (editObj) {
                        await db.collection(collection).doc(editObj.id).update(data);
                        setSuccessMsg('Actualizado correctamente.');
                    } else {
                        await db.collection(collection).add(data);
                        setSuccessMsg('Creado correctamente.');
                        e.target.reset();
                    }
                    setTimeout(() => { setSuccessMsg(''); setEditObj(null); }, 1500);
                } catch(err) { setErrorMsg(err.message); }
                setLoading(false);
            };

            const handleNavigation = (view) => { setCurrentView(view); window.scrollTo(0, 0); };

            const groupedFilteredVideos = useMemo(() => {
                const lowerSearch = String(searchTerm || '').toLowerCase();
                const filtered = videos?.filter((v) => String(v.Nombre || '').toLowerCase().includes(lowerSearch) || String(v.Descripcion || '').toLowerCase().includes(lowerSearch)) || [];
                return filtered.reduce((acc, v) => {
                    const cat = v.Categoria || 'General';
                    if (!acc[cat]) acc[cat] = []; acc[cat].push(v); return acc;
                }, {});
            }, [videos, searchTerm]);

            const toggleCategory = (cat) => setExpandedCategories((prev) => ({ ...prev, [cat]: !prev[cat] }));

            const renderEvidenceLinks = (urlStr) => {
                if (!urlStr || urlStr === 'Sin archivo') return <div className="text-brand-dark/50 font-bold text-xs">Sin Evidencia Adjunta</div>;
                if (urlStr === 'Generado Automático') return <div className="text-brand-dark/50 font-bold text-xs bg-black/5 px-4 py-2 rounded-xl">Validación automática del Sistema</div>;
                const links = urlStr.split(/[\n,\|]+/).filter((l) => l.trim() !== '');
                return links.map((lnk, idx) => (
                    <a key={idx} href={lnk.trim()} target="_blank" rel="noopener noreferrer" className="bg-blue-100 text-blue-700 px-4 py-2 rounded-full font-black text-[10px] uppercase hover:bg-blue-200 transition-colors flex items-center justify-center gap-1.5 shadow-sm border border-blue-200 shrink-0 mt-1">
                        <ExternalLink className="w-3 h-3"/> Ver Archivo {idx + 1}
                    </a>
                ));
            };

            const Topbar = () => (
                <div className="sticky top-0 z-[100] bg-brand-bg1/95 backdrop-blur-xl px-6 py-4 flex justify-between items-center shadow-sm border-b border-brand-dark/10">
                    <div className="flex items-center gap-3">
                        <div className="w-10 h-10 rounded-full shadow-md overflow-hidden border border-brand-dark/10 shrink-0 bg-brand-dark flex items-center justify-center">
                            <ElementaLogo className="w-full h-full object-cover scale-[1.10]" />
                        </div>
                        <span className="font-black text-xl tracking-widest uppercase text-brand-dark">Elementa</span>
                    </div>
                    {user && (
                        <button onClick={handleLogout} className="flex items-center gap-2 px-3 py-1.5 rounded-full hover:bg-black/5 transition-colors text-brand-dark/80 font-bold text-xs uppercase tracking-wider">
                            Salir <LogOut className="w-4 h-4" />
                        </button>
                    )}
                </div>
            );

            const ProfileSuperCard = () => (
                <div className="sticky top-[76px] z-[90] glass-card rounded-[2rem] p-3.5 flex flex-col gap-3.5 border border-white/60 shadow-lg mb-4 transition-all">
                    <div className="flex justify-between items-center">
                        <div className="flex items-center gap-2.5">
                            <div className="w-10 h-10 bg-brand-dark text-brand-bg1 rounded-full flex items-center justify-center font-black text-xl shadow-md ring-2 ring-brand-bg1/50 uppercase">
                                {String(user.Nombres || user.correo || 'E').charAt(0)}
                            </div>
                            <div className="flex flex-col justify-center">
                                <div className="flex items-center gap-2 mb-1">
                                    <h2 className="text-sm font-black uppercase leading-none text-brand-dark tracking-tight">
                                        {user.Nombres ? `${user.Nombres} ${user.Apellidos || ''}` : 'Atleta Elementa'}
                                    </h2>
                                    <button onClick={() => setShowProfileModal(true)} className="text-brand-dark/60 hover:text-brand-dark bg-white/60 hover:bg-white p-1 rounded-full transition-colors shadow-sm border border-brand-dark/10 relative" title="Editar Perfil">
                                        <Settings className="w-3.5 h-3.5" />
                                        {(!user.Cedula) && <span className="absolute -top-0.5 -right-0.5 w-2 h-2 bg-red-500 rounded-full border border-[#f4e6d4]"></span>}

                                            <div className="flex gap-3 w-full">
                                                <button type="button" onClick={() => document.getElementById('cameraInput').click()} className="flex-1 h-32 rounded-2xl bg-white/60 border-2 border-brand-dark/20 flex flex-col items-center justify-center gap-2 font-black shadow-sm"><Camera className="w-8 h-8 opacity-70"/><span className="text-[10px] uppercase">Cámara</span></button>
                                                <button type="button" onClick={() => document.getElementById('multiUpload').click()} className="flex-1 h-32 rounded-2xl bg-white/60 border-2 border-brand-dark/20 flex flex-col items-center justify-center gap-2 font-black shadow-sm"><Upload className="w-8 h-8 opacity-70"/><span className="text-[10px] uppercase">Galería</span></button>
                                            </div>
                                        )}
                                        <input type="file" id="cameraInput" accept="image/*" capture="environment" onChange={handleFileChange} className="hidden" />
                                        <input type="file" id="multiUpload" accept="image/*" multiple onChange={handleFileChange} className="hidden" />
                                        <button type="submit" disabled={loading || previewFiles.length === 0} className="w-full bg-brand-dark text-brand-bg1 p-4 rounded-xl font-black uppercase disabled:opacity-50 mt-4">{loading ? 'Subiendo...' : 'Enviar a Revisión'}</button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {selectedVideo && (
                            <div className="fixed inset-0 z-[120] flex items-center justify-center p-4 modal-overlay animate-fade-in" onClick={() => setSelectedVideo(null)}>
                                <div className="bg-black w-full max-w-4xl rounded-3xl overflow-hidden shadow-2xl relative aspect-video flex flex-col" onClick={e => e.stopPropagation()}>
                                    <div className="absolute top-4 right-4 z-30 flex gap-2">
                                        {!selectedVideo.isCompleted ? <button onClick={completeVideoChallenge} disabled={loading} className="bg-orange-500 text-white px-4 py-2 rounded-full font-black text-[10px] uppercase tracking-wider shadow-lg">Terminé (+ Pts)</button> : <div className="bg-green-500 text-white px-4 py-2 rounded-full font-black text-[10px] uppercase">Visto</div>}
                                        <button onClick={() => setSelectedVideo(null)} className="bg-black/50 text-white p-2 rounded-full"><X className="w-5 h-5" /></button>
                                    </div>
                                    <div className="flex-1 w-full h-full relative">
                                        {selectedVideo.type === 'youtube' ? <iframe src={`https://www.youtube.com/embed/${selectedVideo.id}?autoplay=1`} className="absolute inset-0 w-full h-full border-0" allow="autoplay; fullscreen"></iframe> : <div className="text-white">Video no soportado</div>}
                                    </div>
                                </div>
                            </div>
                        )}

                        {selectedHistoryItem && (
                            <div className="fixed inset-0 z-[120] flex items-center justify-center p-4 modal-overlay animate-fade-in" onClick={() => setSelectedHistoryItem(null)}>
                                <div className="bg-[#f0e3d1] w-full max-w-md rounded-[2.5rem] p-6 shadow-2xl relative animate-zoom-in border border-white/20" onClick={e => e.stopPropagation()}>
                                    <button onClick={() => setSelectedHistoryItem(null)} className="absolute top-4 right-4 bg-brand-dark/10 p-2 rounded-full"><X className="w-4 h-4" /></button>
                                    <h3 className="text-xl font-black uppercase text-brand-dark mb-4">Detalle Solicitud</h3>
                                    <div className="space-y-4">
                                        <div><span className="text-[10px] font-black uppercase block mb-1">Estado</span><span className="bg-brand-dark text-white px-3 py-1 rounded text-xs font-black uppercase">{selectedHistoryItem.Estado}</span></div>
                                        <div className="bg-white/60 p-3 rounded-xl space-y-1">{String(selectedHistoryItem.Reto).split(' | ').map((l, i) => <p key={i} className="text-xs font-black uppercase">{l}</p>)}</div>
                                        {selectedHistoryItem.Puntos > 0 && <div className="bg-green-100 text-green-700 p-3 rounded-xl font-black flex justify-between"><span className="text-xs uppercase">Puntos</span><span className="text-lg">+{selectedHistoryItem.Puntos}</span></div>}
                                        {selectedHistoryItem.Observacion && <div className="bg-black/5 p-3 rounded-xl italic text-xs font-bold text-brand-dark/70">"{selectedHistoryItem.Observacion}"</div>}
                                    </div>
                                </div>
                            </div>
                        )}
                        
                        {selectedPost && (
                            <div className="fixed inset-0 z-[120] flex items-center justify-center p-0 sm:p-6 modal-overlay animate-fade-in" onClick={() => setSelectedPost(null)}>
                                <div className="bg-brand-bg1 w-full h-full sm:max-h-[90vh] sm:max-w-4xl sm:rounded-[2.5rem] overflow-hidden shadow-2xl relative animate-zoom-in flex flex-col border border-white/10" onClick={e => e.stopPropagation()}>
                                    <button onClick={() => setSelectedPost(null)} className="absolute top-4 right-4 z-30 bg-black/40 backdrop-blur-md text-white p-2 rounded-full shadow-lg"><X className="w-6 h-6" /></button>
                                    <div className="flex-1 overflow-y-auto hide-scroll">
                                        {selectedPost.URL_Imagen && <img src={selectedPost.URL_Imagen} className="w-full h-auto object-cover max-h-96" />}
                                        <div className="p-8">
                                            <h2 className="text-4xl font-black text-brand-dark mb-6">{selectedPost.Titulo}</h2>
                                            <div className="text-brand-dark/90 font-medium whitespace-pre-wrap">{selectedPost.Descripcion}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                    </div>
                    {user && currentView !== 'login' && <BottomNav />}
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
